# Site B (judge). Run INSIDE a VM with cgroup v1 (see docs/deploy.md):
#   cp judge0.conf.example judge0.conf && edit secrets && docker compose up -d
# Based on the official Judge0 CE 1.13.1 compose; image tags are pinned on purpose.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"   # reachable only over the tailnet / VM firewall; protected by AUTHN_TOKEN
    privileged: true  # required by isolate (sandbox)
    logging: *default-logging
    restart: always
    depends_on: [db, redis]

  worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    logging: *default-logging
    restart: always
    depends_on: [db, redis]

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0-postgres:/var/lib/postgresql/data/
    logging: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    logging: *default-logging
    restart: always

volumes:
  judge0-postgres:
